<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pahana Lighting Ceremony - Guest Tablet</title>
  
  <!-- Web App Capabilities for Android / Tablet Fullscreen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: {
              900: '#1a0305',
              950: '#0d0102',
            },
            gold: {

              400: '#facc15',

              600: '#ca8a04',

  <style>
    /* Prevent any browser gestures or text selections on tablet */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    body {
      overscroll-behavior: none;
      background-color: #0d0102;
    }

    /* Laser Scanner Beam Animation */
    @keyframes scanMotion {
      0% {
        top: 0%;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        top: 96%;
        opacity: 0;
      }
    }

    .scanner-beam {
      animation: scanMotion 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Ambient pulse for idle state */
    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 0 45px rgba(234, 179, 8, 0.45);
      }
    }

    .idle-pulse {
      animation: subtlePulse 3.5s ease-in-out infinite;
    }

    /* Success flash */
    @keyframes successGlow {
      0% {
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.6), inset 0 0 30px rgba(74, 222, 128, 0.4);
      }
      50% {
        box-shadow: 0 0 80px rgba(234, 179, 8, 0.9), inset 0 0 50px rgba(250, 204, 21, 0.7);
      }
      100% {
        box-shadow: 0 0 35px rgba(74, 222, 128, 0.6);
      }
    }

    .success-pulse {
      animation: successGlow 1.2s ease-in-out infinite;
    }

    /* Circular SVG Progress */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.05s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Traditional Kandyan motif watermark */
    .liyavel-pattern {
      background-image: radial-gradient(circle at 50% 50%, rgba(218, 165, 32, 0.08) 0%, transparent 70%);
    }
  </style>
</head>

<body class="h-full flex flex-col justify-between items-center text-white p-6 relative overflow-hidden liyavel-pattern" oncontextmenu="return false;">

  <!-- CENTER SCANNER INTERFACE -->

      <!-- Circular Progress Ring SVG (280x280) -->

    <!-- Instructions / Real-Time Status -->

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // ========================================================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ========================================================================
    // If firebase-config.js did not define window.firebaseConfig, use this template.
    const defaultFirebaseConfig = {
      apiKey: "AIzaSyDz2tXS4DZfU1GQezp2NyUZJ4oU_QSh5yI",
      authDomain: "year-end-lighting-oil-lamp.firebaseapp.com",
      databaseURL: "https://year-end-lighting-oil-lamp-default-rtdb.firebaseio.com",
      projectId: "year-end-lighting-oil-lamp",
      storageBucket: "year-end-lighting-oil-lamp.firebasestorage.app",
      messagingSenderId: "1089802445328",
      appId: "1:1089802445328:web:0f02cdbb4962b1f0dfe095",
      measurementId: "G-KCV78Z03S5"
    };

    const config = window.firebaseConfig || defaultFirebaseConfig;
    
    // Check if real Firebase config is provided
    const isFirebaseConfigured = config.apiKey && config.apiKey !== "YOUR_API_KEY";
    
    let db = null;
    let lampStateRef = null;

    if (isFirebaseConfigured && typeof firebase !== 'undefined') {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        db = firebase.database();
        lampStateRef = db.ref('lampState');
        console.log("Firebase initialized successfully on Tablet.");
      } catch (err) {
        console.error("Firebase init error:", err);
      }
    } else {
      console.warn("Using BroadcastChannel/localStorage fallback for local sync (no Firebase credentials entered yet).");
    }

    // BroadcastChannel fallback for multi-tab testing without Firebase setup
    const localSyncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('pahana_sync') : null;

    // ========================================================================
    // 2. SYNTHESIZED WEB AUDIO (Ceremonial Bell & Scanning Tone)
    // ========================================================================
    let audioCtx = null;
    let scanOscillator = null;
    let scanGain = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Start soft rising humming tone during scan
    function startScanSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        
        scanOscillator = audioCtx.createOscillator();
        scanGain = audioCtx.createGain();

        scanOscillator.type = 'sine';
        scanOscillator.frequency.setValueAtTime(220, audioCtx.currentTime); // A3 note
        scanOscillator.frequency.exponentialRampToValueAtTime(554.37, audioCtx.currentTime + 2.0); // C#5

        scanGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        scanGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 2.0);

        scanOscillator.connect(scanGain);
        scanGain.connect(audioCtx.destination);
        scanOscillator.start();
      } catch (e) {
        // audio might be blocked by browser policy until gesture
      }
    }

    // Stop scanning tone smoothly
    function stopScanSound() {
      if (scanOscillator && scanGain && audioCtx) {
        try {
          scanGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
          setTimeout(() => {
            if (scanOscillator) {
              scanOscillator.stop();
              scanOscillator.disconnect();
              scanOscillator = null;
            }
          }, 120);
        } catch (e) {}
      }
    }

    // Play traditional Sri Lankan brass bell / singing bowl chime upon success
    function playSuccessChime() {
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        // Harmonic frequencies of a traditional brass bell
        const freqs = [528, 1056, 1584, 2112];
        const gains = [0.25, 0.15, 0.08, 0.04];

        freqs.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(gains[i], now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 3.0);
        });
      } catch (e) {}
    }

    // ========================================================================
    // 3. UI REFERENCES & STATE MANAGEMENT
    // ========================================================================
    const scanContainer = document.getElementById('scan-container');
    const fingerprintPad = document.getElementById('fingerprint-pad');
    const fingerprintSvg = document.getElementById('fingerprint-svg');
    const scannerBeam = document.getElementById('scanner-beam');
    const progressCircle = document.getElementById('progress-circle');
    const successIcon = document.getElementById('success-icon');
    const instructionTitle = document.getElementById('instruction-title');
    const instructionSub = document.getElementById('instruction-sub');
    const scanPercentage = document.getElementById('scan-percentage');
    const wickCountBadge = document.getElementById('wick-count-badge');
    const wickDots = document.getElementById('wick-dots');
    const secretLogoBtn = document.getElementById('secret-logo-btn');
    const adminResetBtn = document.getElementById('admin-reset-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const connectionStatus = document.getElementById('connection-status');

    const CIRCUMFERENCE = 2 * Math.PI * 125; // 785.4
    const HOLD_DURATION_MS = 2000; // 2 seconds
    const MAX_WICKS = 5;

    let currentLitWicks = 0;
    let holdStartTime = null;
    let scanAnimationFrameId = null;
    let isHolding = false;
    let isLocked = false; // Cooldown lock after success
    let secretClickCount = 0;
    let secretClickTimer = null;

    // Set initial stroke dash
    progressCircle.style.strokeDasharray = `${CIRCUMFERENCE}`;
    progressCircle.style.strokeDashoffset = `${CIRCUMFERENCE}`;

    // ========================================================================
    // 4. DATABASE SYNC (Firebase + Fallback)
    // ========================================================================
    function updateWickDisplay(count) {
      currentLitWicks = Math.min(Math.max(count || 0, 0), MAX_WICKS);
      wickCountBadge.textContent = `${currentLitWicks} / ${MAX_WICKS}`;

      // Update dots
      for (let i = 1; i <= MAX_WICKS; i++) {
        const dot = document.querySelector(`.dot-1, .dot-2, .dot-3, .dot-4, .dot-5`)[i - 1] || wickDots.children[i - 1];
        if (dot) {
          if (i <= currentLitWicks) {
            dot.className = 'w-2.5 h-2.5 rounded-full bg-gold-400 shadow-[0_0_8px_#facc15] transition-all duration-500';
          } else {
            dot.className = 'w-2.5 h-2.5 rounded-full bg-white/20 transition-all duration-500';
          }
        }
      }

      if (currentLitWicks >= MAX_WICKS) {
        instructionTitle.textContent = "All 5 Wicks Are Lit!";
        instructionTitle.className = "font-sans font-bold text-base md:text-lg text-gold-300 tracking-wide";
        instructionSub.textContent = "The Pahana is fully illuminated. Ceremony Complete.";
      } else if (!isLocked && !isHolding) {
        instructionTitle.textContent = "Press & Hold to Ignite Flame";
        instructionTitle.className = "font-sans font-semibold text-base md:text-lg text-amber-100 tracking-wide";
        instructionSub.textContent = `Hold for 2 seconds • Wick #${currentLitWicks + 1} of ${MAX_WICKS}`;
      }
    }

    // Listen to Firebase Realtime Database
    if (lampStateRef) {
      lampStateRef.on('value', (snapshot) => {
        const val = snapshot.val();
        connectionStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live';
        if (val) {
          updateWickDisplay(val.litWicks || 0);
        } else {
          updateWickDisplay(0);
        }
      }, (err) => {
        console.error("Firebase sync error:", err);
        connectionStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Firebase: Permission Denied';
      });
    } else {
      // Local storage check
      const stored = parseInt(localStorage.getItem('lampState_litWicks') || '0', 10);
      updateWickDisplay(stored);
      connectionStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Local Fallback';
    }

    // Listen to BroadcastChannel for local cross-tab sync
    if (localSyncChannel) {
      localSyncChannel.onmessage = (event) => {
        if (event.data && typeof event.data.litWicks !== 'undefined') {
          updateWickDisplay(event.data.litWicks);
        }
      };
    }

    // Save litWicks to Firebase and fallback
    async function setLampStateInDB(newCount) {
      const timestamp = Date.now();
      localStorage.setItem('lampState_litWicks', newCount.toString());
      localStorage.setItem('lampState_lastTriggered', timestamp.toString());

      if (localSyncChannel) {
        localSyncChannel.postMessage({ litWicks: newCount, lastTriggered: timestamp });
      }

      if (lampStateRef) {
        try {
          await lampStateRef.update({
            litWicks: newCount,
            lastTriggered: timestamp
          });
          console.log("Firebase updated litWicks to:", newCount);
        } catch (e) {
          console.error("Failed to update Firebase (Check Database Rules!):", e);
          connectionStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Firebase Write Denied';
        }
      }
    }

    // Increment wick count
    async function triggerWickIgnition() {
      if (currentLitWicks >= MAX_WICKS) {
        console.log("Max wicks already lit.");
        return;
      }

      if (lampStateRef) {
        try {
          await lampStateRef.transaction((current) => {
            const currentCount = (current && current.litWicks) || 0;
            if (currentCount >= MAX_WICKS) return current;
            return {
              litWicks: currentCount + 1,
              lastTriggered: Date.now()
            };
          });
        } catch (e) {
          console.error("Transaction error, falling back to direct write:", e);
          await setLampStateInDB(currentLitWicks + 1);
        }
      } else {
        await setLampStateInDB(currentLitWicks + 1);
      }
    }

    // Reset wick count to 0
    async function resetLampState() {
      await setLampStateInDB(0);
      updateWickDisplay(0);
      resetScannerUI();
    }

    // ========================================================================
    // 5. TOUCH / POINTER SCANNER INTERACTION
    // ========================================================================
    function startScanning(e) {
      if (e) e.preventDefault();
      if (isLocked) return;
      if (isHolding) return;

      if (currentLitWicks >= MAX_WICKS) {
        instructionTitle.textContent = "All Wicks Already Lit";
        instructionSub.textContent = "Triple-click top emblem to reset for testing.";
        return;
      }

      isHolding = true;
      holdStartTime = performance.now();

      // UI changes
      fingerprintPad.classList.remove('idle-pulse');
      fingerprintPad.classList.add('scale-105', 'border-gold-400');
      fingerprintSvg.classList.remove('text-white/70');
      fingerprintSvg.classList.add('text-gold-400');
      scannerBeam.classList.remove('hidden');
      scanPercentage.classList.remove('opacity-0');

      instructionTitle.textContent = "Scanning Fingerprint...";
      instructionTitle.className = "font-sans font-bold text-base md:text-lg text-gold-300 tracking-wide";
      instructionSub.textContent = "Please hold still for 2 seconds...";

      // Audio & Haptic
      startScanSound();
      if (navigator.vibrate) {
        navigator.vibrate([30]);
      }

      // Start animation loop
      cancelAnimationFrame(scanAnimationFrameId);
      scanAnimationFrameId = requestAnimationFrame(scanProgressLoop);
    }

    function scanProgressLoop(now) {
      if (!isHolding) return;

      const elapsed = now - holdStartTime;
      const progress = Math.min(elapsed / HOLD_DURATION_MS, 1.0);

      // Update circular SVG stroke
      const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
      progressCircle.style.strokeDashoffset = offset;

      // Update percentage text
      const percentInt = Math.floor(progress * 100);
      scanPercentage.textContent = `SCANNING: ${percentInt}%`;

      // Intermediate gentle haptic tap at 50%
      if (percentInt === 50 && navigator.vibrate) {
        navigator.vibrate([20]);
      }

      if (progress < 1.0) {
        scanAnimationFrameId = requestAnimationFrame(scanProgressLoop);
      } else {
        // SUCCESS: Hold completed 2 full seconds!
        handleScanSuccess();
      }
    }

    function cancelScanning() {
      if (!isHolding || isLocked) return;

      isHolding = false;
      cancelAnimationFrame(scanAnimationFrameId);
      stopScanSound();

      // Reset circular progress smoothly
      progressCircle.style.transition = 'stroke-dashoffset 0.25s ease-out';
      progressCircle.style.strokeDashoffset = `${CIRCUMFERENCE}`;
      setTimeout(() => {
        progressCircle.style.transition = 'stroke-dashoffset 0.05s linear';
      }, 260);

      // Revert scanner visual state
      fingerprintPad.classList.add('idle-pulse');
      fingerprintPad.classList.remove('scale-105', 'border-gold-400');
      fingerprintSvg.classList.remove('text-gold-400');
      fingerprintSvg.classList.add('text-white/70');
      scannerBeam.classList.add('hidden');
      scanPercentage.classList.add('opacity-0');

      if (currentLitWicks < MAX_WICKS) {
        instructionTitle.textContent = "Hold Required (2 Seconds)";
        instructionTitle.className = "font-sans font-semibold text-base md:text-lg text-amber-200 tracking-wide";
        instructionSub.textContent = "Please hold finger steadily until full circle completes.";

        setTimeout(() => {
          if (!isHolding && !isLocked && currentLitWicks < MAX_WICKS) {
            instructionTitle.textContent = "Press & Hold to Ignite Flame";
            instructionSub.textContent = `Hold for 2 seconds • Wick #${currentLitWicks + 1} of ${MAX_WICKS}`;
          }
        }, 1800);
      }
    }

    function handleScanSuccess() {
      isHolding = false;
      isLocked = true; // Lock UI during success presentation
      cancelAnimationFrame(scanAnimationFrameId);
      stopScanSound();

      // Trigger Firebase / Database increment
      triggerWickIgnition();

      // Sound & Strong Haptic
      playSuccessChime();
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 200]);
      }

      // Visual transformation
      scannerBeam.classList.add('hidden');
      fingerprintSvg.classList.add('hidden');
      successIcon.classList.remove('hidden');

      fingerprintPad.classList.remove('border-gold-400', 'idle-pulse');
      fingerprintPad.classList.add('success-pulse', 'border-emerald-400');

      instructionTitle.textContent = `Flame #${currentLitWicks} Ignited!`;
      instructionTitle.className = "font-sans font-bold text-lg md:text-xl text-emerald-400 tracking-wide";
      instructionSub.textContent = "Look up at the main ceremonial display screen ✨";
      scanPercentage.textContent = "VERIFIED • AUSPICIOUS LIGHT";

      // 4-Second Cool-down for next guest
      let countdown = 3;
      const countdownInterval = setInterval(() => {
        if (currentLitWicks >= MAX_WICKS) {
          clearInterval(countdownInterval);
          return;
        }
        instructionSub.textContent = `Next guest ready in ${countdown}s...`;
        countdown--;
        if (countdown < 0) {
          clearInterval(countdownInterval);
          resetScannerUI();
        }
      }, 1000);
    }

    function resetScannerUI() {
      isLocked = false;
      isHolding = false;

      // Reset SVGs
      fingerprintSvg.classList.remove('hidden', 'text-gold-400');
      fingerprintSvg.classList.add('text-white/70');
      successIcon.classList.add('hidden');

      fingerprintPad.classList.remove('success-pulse', 'border-emerald-400', 'scale-105');
      fingerprintPad.classList.add('idle-pulse', 'border-gold-500/30');

      progressCircle.style.strokeDashoffset = `${CIRCUMFERENCE}`;
      scannerBeam.classList.add('hidden');
      scanPercentage.classList.add('opacity-0');

      updateWickDisplay(currentLitWicks);
    }

    // Attach Pointer Events (Works identically for Touch, Pen, and Mouse)
    scanContainer.addEventListener('pointerdown', startScanning);
    window.addEventListener('pointerup', cancelScanning);
    window.addEventListener('pointercancel', cancelScanning);

    // ========================================================================
    // 6. HIDDEN ADMIN RESET (5 Clicks on Emblem)
    // ========================================================================
    secretLogoBtn.addEventListener('click', () => {
      secretClickCount++;
      clearTimeout(secretClickTimer);

      if (secretClickCount >= 5) {
        secretClickCount = 0;
        if (confirm("Reset lit wicks to 0 for rehearsals / next session?")) {
          resetLampState();
        }
      } else {
        secretClickTimer = setTimeout(() => {
          secretClickCount = 0;
        }, 2500);
      }
    });

    // Secondary discrete reset button in footer
    adminResetBtn.addEventListener('click', () => {
      const pin = prompt("Enter Admin PIN to reset lamp (default: 1234):");
      if (pin === "1234" || pin === "admin") {
        resetLampState();
      } else if (pin !== null) {
        alert("Incorrect PIN");
      }
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
