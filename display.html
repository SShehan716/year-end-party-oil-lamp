  <!-- ======================================================================
       JAVASCRIPT: REAL-TIME 3D THREE.JS ENGINE & FIREBASE SYNC
       ====================================================================== -->
  <script>
    // ========================================================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ========================================================================
    const defaultFirebaseConfig = {
      apiKey: "AIzaSyDz2tXS4DZfU1GQezp2NyUZJ4oU_QSh5yI",
      authDomain: "year-end-lighting-oil-lamp.firebaseapp.com",
      databaseURL: "https://year-end-lighting-oil-lamp-default-rtdb.firebaseio.com",
      projectId: "year-end-lighting-oil-lamp",
      storageBucket: "year-end-lighting-oil-lamp.firebasestorage.app",
      messagingSenderId: "1089802445328",
      appId: "1:1089802445328:web:0f02cdbb4962b1f0dfe095",
      measurementId: "G-KCV78Z03S5"
    };

    const config = window.firebaseConfig || defaultFirebaseConfig;
    const isFirebaseConfigured = config.apiKey && config.apiKey !== "YOUR_API_KEY";

    let db = null;
    let lampStateRef = null;

    if (isFirebaseConfigured && typeof firebase !== 'undefined') {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        db = firebase.database();
        lampStateRef = db.ref('lampState');
        console.log("Firebase initialized successfully on Display.");
      } catch (err) {
        console.error("Firebase init error on display:", err);
      }
    } else {
      console.warn("Using BroadcastChannel/localStorage fallback for local sync.");
    }

    const localSyncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('pahana_sync') : null;

    // ========================================================================
    // 2. SYNTHESIZED CEREMONIAL AUDIO (Web Audio API)
    // ========================================================================
    let audioCtx = null;
    let isAudioEnabled = false;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isAudioEnabled = true;
      updateAudioIcon();
    }

    function updateAudioIcon() {
      const onIcon = document.getElementById('audio-icon-on');
      const offIcon = document.getElementById('audio-icon-off');
      if (isAudioEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function playWickIgniteSound(wickNumber) {
      if (!isAudioEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        // Ascending harmonic pitches for all 15 wicks
        const basePitches = [
          196.00, // G3 (Wick 1)
          220.00, // A3 (Wick 2)
          246.94, // B3 (Wick 3)
          261.63, // C4 (Wick 4)
          293.66, // D4 (Wick 5)
          329.63, // E4 (Wick 6)
          349.23, // F4 (Wick 7)
          392.00, // G4 (Wick 8)
          440.00, // A4 (Wick 9)
          493.88, // B4 (Wick 10 - Lower Tier Completion)
          523.25, // C5 (Wick 11 - Upper Tier Start)
          587.33, // D5 (Wick 12)
          659.25, // E5 (Wick 13)
          698.46, // F5 (Wick 14)
          783.99  // G5 (Wick 15 - Auspicious Summit)
        ];
        const root = basePitches[Math.min(Math.max(wickNumber - 1, 0), basePitches.length - 1)];

        // Flame whoosh
        const bufferSize = audioCtx.sampleRate * 0.35;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.08));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + 0.35);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.25, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);

        // Harmonic brass bell tone
        const harmonics = [1, 2, 2.76, 4.07, 5.43];
        const harmonicGains = [0.35, 0.2, 0.12, 0.06, 0.03];

        harmonics.forEach((h, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = idx === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(root * h, now);

          gain.gain.setValueAtTime(harmonicGains[idx], now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 4.0);
        });
      } catch (e) {}
    }

    function playGrandFinaleSound() {
      if (!isAudioEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const chord = [220, 277.18, 329.63, 440, 554.37, 659.25];
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.25 / (idx * 0.5 + 1), now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + 6.2);
        });
      } catch (e) {}
    }

    // ========================================================================
    // 3. THREE.JS 3D ENGINE & AUTHENTIC SRI LANKAN PAHANA MODEL
    // ========================================================================
    const container = document.getElementById('webgl-canvas-container');
    let scene, camera, renderer, controls;
    let lampGroup;
    let wickAnchors = [];
    let wickLights = [];
    let wickFlames = [];
    let emberParticles = [];
    let flameTexture;

    // 15 Ceremonial Wicks (Two-Tier Architecture: 10 Lower Tier + 5 Upper Tier)
    const MAX_WICKS = 15;
    const LOWER_TIER_COUNT = 10;
    const UPPER_TIER_COUNT = 5;

    // Helper to calculate the radial 3D angle for any of the 15 wicks
    function getWickAngle(index) {
      if (index < LOWER_TIER_COUNT) {
        return (index * 2 * Math.PI) / LOWER_TIER_COUNT;
      } else {
        const upperIdx = index - LOWER_TIER_COUNT;
        return (upperIdx * 2 * Math.PI) / UPPER_TIER_COUNT + (Math.PI / 10);
      }
    }

    // Rotation Control State
    let isAutoRotating = true;
    let autoRotateMode = 'sway'; // 'sway' (gentle ±12° ceremonial arc) or 'spin' (360°)
    let targetRotationY = null;
    let celebrationSpinRemaining = 0;
    const BASE_ROTATION_SPEED = 0.0035;

    // Create Procedural High-Res Flame Sprite Texture
    function createFlameTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(64, 180, 5, 64, 140, 60);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 235, 100, 0.95)');
      grad.addColorStop(0.45, 'rgba(255, 140, 20, 0.85)');
      grad.addColorStop(0.8, 'rgba(230, 60, 0, 0.4)');
      grad.addColorStop(1.0, 'rgba(200, 20, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      // Teardrop shape
      ctx.moveTo(64, 30);
      ctx.bezierCurveTo(115, 120, 115, 210, 64, 210);
      ctx.bezierCurveTo(13, 210, 13, 120, 64, 30);
      ctx.fill();

      // Inner hot core
      const coreGrad = ctx.createRadialGradient(64, 180, 2, 64, 160, 25);
      coreGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
      coreGrad.addColorStop(0.5, 'rgba(255, 255, 220, 0.9)');
      coreGrad.addColorStop(1.0, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(64, 175, 20, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    let isFallbackActive = false;
    function activate2DFallback() {
      isFallbackActive = true;
      const fbStage = document.getElementById('fallback-pahana-stage');
      if (fbStage) {
        fbStage.classList.remove('hidden');
        fbStage.classList.add('flex');
      }
      for (let i = 1; i <= MAX_WICKS; i++) {
        const flame = document.getElementById(`fb-flame-${i}`);
        if (flame) {
          if (i <= currentLitWicks) flame.classList.remove('hidden');
          else flame.classList.add('hidden');
        }
      }
    }

    function init3D() {
      try {
        scene = new THREE.Scene();

        // Camera: elevated so viewer looks down into the dish and sees all 5 wicks clearly
        camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.8, 22);

        // WebGL Renderer with PBR Tonemapping
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // OrbitControls: allows interactive inspection
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.08;
        controls.minDistance = 12;
        controls.maxDistance = 35;
        controls.target.set(0, 0.5, 0);

        // 3D Scene Lighting
        const ambientLight = new THREE.AmbientLight(0x4a2408, 1.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff1cf, 2.6);
        keyLight.position.set(9, 14, 11);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x8a4510, 1.5);
        fillLight.position.set(-9, 8, -6);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffb733, 2.0);
        backLight.position.set(0, 12, -12);
        scene.add(backLight);

        // Ground Shadow Plane
        const shadowPlaneGeo = new THREE.PlaneGeometry(25, 25);
        const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.5 });
        const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -7.05;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        // Build Procedural 3D Brass Pahana
        flameTexture = createFlameTexture();
        buildProceduralPahana();

        // Window resize
        window.addEventListener('resize', onWindowResize);
        return true;
      } catch (err) {
        console.warn("WebGL not available in this environment, activating 3D Image + CSS fallback:", err);
        activate2DFallback();
        return false;
      }
    }

    function buildProceduralPahana() {
      lampGroup = new THREE.Group();
      scene.add(lampGroup);

      // PBR Metallic Polished Brass Material
      const brassMaterial = new THREE.MeshStandardMaterial({
        color: 0xdfa632,
        metalness: 0.88,
        roughness: 0.22,
        bumpScale: 0.05,
      });

      // 1. LATHE PROFILE CURVE: Exact Traditional Sri Lankan Turned Brass Profile
      const points = [
        new THREE.Vector2(0, -7.0),
        new THREE.Vector2(3.4, -7.0),
        new THREE.Vector2(3.4, -6.7),
        new THREE.Vector2(3.1, -6.7),
        new THREE.Vector2(3.0, -6.3),
        new THREE.Vector2(2.5, -6.1),
        new THREE.Vector2(2.1, -5.6),
        new THREE.Vector2(1.5, -5.2),
        new THREE.Vector2(1.6, -4.9),
        new THREE.Vector2(1.2, -4.7),

        // Lower stem turned column
        new THREE.Vector2(0.75, -4.7),
        new THREE.Vector2(0.7, -3.8),
        new THREE.Vector2(1.2, -3.4),
        new THREE.Vector2(0.8, -3.2),
        new THREE.Vector2(1.55, -2.4), // Fluted Kavadi bulb
        new THREE.Vector2(0.8, -1.6),
        new THREE.Vector2(1.15, -1.4),
        new THREE.Vector2(0.8, -1.2),

        // Main 5-Wick Oil Reservoir Dish (Tetiya)
        new THREE.Vector2(0.9, -0.6),
        new THREE.Vector2(1.8, -0.4),
        new THREE.Vector2(3.2, -0.2),
        new THREE.Vector2(3.55, 0.0), // Outer lip
        new THREE.Vector2(3.35, 0.05),
        new THREE.Vector2(3.1, -0.15), // Inner dip
        new THREE.Vector2(2.0, -0.3),
        new THREE.Vector2(0.8, -0.4),

        // Column above main dish
        new THREE.Vector2(0.7, 0.0),
        new THREE.Vector2(0.65, 1.2),
        new THREE.Vector2(0.95, 1.4),
        new THREE.Vector2(0.7, 1.6),

        // Upper second tier dish
        new THREE.Vector2(1.4, 1.8),
        new THREE.Vector2(2.1, 2.0),
        new THREE.Vector2(1.9, 1.9),
        new THREE.Vector2(0.7, 1.95),

        // Spindle to crown finial
        new THREE.Vector2(0.55, 2.5),
        new THREE.Vector2(0.85, 2.8),
        new THREE.Vector2(0.6, 3.2),
        new THREE.Vector2(0.9, 3.5),
        new THREE.Vector2(0.4, 3.7),
        new THREE.Vector2(0, 3.8)
      ];

      const latheGeo = new THREE.LatheGeometry(points, 64);
      const latheMesh = new THREE.Mesh(latheGeo, brassMaterial);
      latheMesh.castShadow = true;
      latheMesh.receiveShadow = true;
      lampGroup.add(latheMesh);

      // 2. THE 15 AUTHENTIC CEREMONIAL WICK SPOUTS & FLAMES
      // Two-Tier Architecture: 10 Wicks on Lower Main Dish + 5 Wicks on Upper Tier
      const lowerRadius = 3.55;
      const lowerY = 0.02;
      const upperRadius = 2.05;
      const upperY = 1.95;

      for (let i = 0; i < MAX_WICKS; i++) {
        const isLowerTier = i < LOWER_TIER_COUNT;
        const angle = getWickAngle(i);
        const radius = isLowerTier ? lowerRadius : upperRadius;
        const posY = isLowerTier ? lowerY : upperY;
        const scaleFactor = isLowerTier ? 1.0 : 0.82;

        const wickAnchor = new THREE.Group();
        wickAnchor.position.set(
          Math.sin(angle) * radius,
          posY,
          Math.cos(angle) * radius
        );
        wickAnchor.rotation.y = angle;

        // Brass spout projection beak
        const spoutGeo = new THREE.ConeGeometry(0.35 * scaleFactor, 0.7 * scaleFactor, 16);
        const spoutMesh = new THREE.Mesh(spoutGeo, brassMaterial);
        spoutMesh.rotation.x = Math.PI / 2;
        spoutMesh.position.set(0, 0, 0.25 * scaleFactor);
        wickAnchor.add(spoutMesh);

        // Cotton Wick Tip
        const wickCottonGeo = new THREE.CylinderGeometry(0.07 * scaleFactor, 0.07 * scaleFactor, 0.35 * scaleFactor, 8);
        const wickCottonMat = new THREE.MeshStandardMaterial({ color: 0x241812, roughness: 0.9 });
        const wickCotton = new THREE.Mesh(wickCottonGeo, wickCottonMat);
        wickCotton.position.set(0, 0.12 * scaleFactor, 0.4 * scaleFactor);
        wickCotton.rotation.x = 0.2;
        wickAnchor.add(wickCotton);

        // 3D Cross-Quad Flickering Flame
        const flameGroup = new THREE.Group();
        flameGroup.position.set(0, 0.45 * scaleFactor, 0.4 * scaleFactor);
        flameGroup.scale.set(0.001, 0.001, 0.001); // starts unlit

        const flameMat = new THREE.MeshBasicMaterial({
          map: flameTexture,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const quadW = 0.85 * scaleFactor;
        const quadH = 1.6 * scaleFactor;
        const quad1 = new THREE.Mesh(new THREE.PlaneGeometry(quadW, quadH), flameMat);
        const quad2 = new THREE.Mesh(new THREE.PlaneGeometry(quadW, quadH), flameMat);
        quad2.rotation.y = Math.PI / 2;
        flameGroup.add(quad1);
        flameGroup.add(quad2);
        wickAnchor.add(flameGroup);

        // 3D Point Light casting dynamic firelight on the brass
        const lightDist = isLowerTier ? 9 : 7;
        const lightIntensity = isLowerTier ? 2.4 : 2.0;
        const wickPointLight = new THREE.PointLight(0xff9900, 0, lightDist, 1.6);
        wickPointLight.position.set(0, 0.5 * scaleFactor, 0.4 * scaleFactor);
        wickAnchor.add(wickPointLight);

        lampGroup.add(wickAnchor);

        wickAnchors.push(wickAnchor);
        wickFlames.push(flameGroup);
        wickLights.push(wickPointLight);
      }

      // 3. THE CROWN FINIAL: KANDYAN ROOSTER (පහනේ කුකුළා / HANSA)
      build3DRoosterFinial(lampGroup, brassMaterial);

      // 4. FLOATING 3D EMBER SPARK SYSTEM
      createEmberSystem();
    }

    function build3DRoosterFinial(parent, material) {
      const rooster = new THREE.Group();
      rooster.position.set(0, 3.8, 0);

      // Bird Torso
      const bodyGeo = new THREE.SphereGeometry(0.75, 24, 24);
      const body = new THREE.Mesh(bodyGeo, material);
      body.scale.set(0.8, 1.1, 1.4);
      body.position.set(0, 0.9, 0.1);
      body.castShadow = true;
      rooster.add(body);

      // Proud Upright Neck & Head
      const neckGeo = new THREE.CylinderGeometry(0.3, 0.45, 1.0, 16);
      const neck = new THREE.Mesh(neckGeo, material);
      neck.position.set(0, 1.65, 0.7);
      neck.rotation.x = -0.2;
      neck.castShadow = true;
      rooster.add(neck);

      const headGeo = new THREE.SphereGeometry(0.36, 16, 16);
      const head = new THREE.Mesh(headGeo, material);
      head.position.set(0, 2.2, 0.85);
      rooster.add(head);

      // Beak
      const beakGeo = new THREE.ConeGeometry(0.12, 0.5, 12);
      const beak = new THREE.Mesh(beakGeo, material);
      beak.rotation.x = Math.PI / 2;
      beak.position.set(0, 2.15, 1.25);
      rooster.add(beak);

      // Comb / Crest
      const combGeo = new THREE.TorusGeometry(0.25, 0.08, 8, 16, Math.PI);
      const comb = new THREE.Mesh(combGeo, material);
      comb.position.set(0, 2.5, 0.8);
      comb.rotation.y = Math.PI / 2;
      rooster.add(comb);

      // Ornate Arched Tail Plumes (Traditional curved brass feathers)
      const tailGroup = new THREE.Group();
      tailGroup.position.set(0, 1.2, -0.6);

      for (let f = 0; f < 5; f++) {
        const spread = (f - 2) * 0.12;
        const curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(spread * 1.5, 1.8, -1.2),
          new THREE.Vector3(spread * 2.2, 2.6 - Math.abs(spread) * 0.5, -0.3)
        );
        const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.09 - f * 0.01, 8, false);
        const feather = new THREE.Mesh(tubeGeo, material);
        feather.castShadow = true;
        tailGroup.add(feather);
      }
      rooster.add(tailGroup);

      parent.add(rooster);
    }

    function createEmberSystem() {
      const emberCount = 60;
      const emberGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(emberCount * 3);

      for (let i = 0; i < emberCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 6;
        positions[i + 1] = -100; // inactive
        positions[i + 2] = (Math.random() - 0.5) * 6;
      }

      emberGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const emberMat = new THREE.PointsMaterial({
        color: 0xffd54f,
        size: 0.18,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });

      emberParticles = new THREE.Points(emberGeo, emberMat);
      scene.add(emberParticles);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ========================================================================
    // 4. ANIMATION LOOP & ROTATION ENGINE
    // ========================================================================
    let clock = new THREE.Clock();

    function animate() {
      if (!renderer || !scene || !camera) return;
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Controls update
      controls.update();

      // 1. ROTATION LOGIC ("this should rotate when lighting")
      if (lampGroup) {
        if (celebrationSpinRemaining > 0) {
          // Auspicious celebratory 360-degree spin for grand finale
          const spinStep = Math.min(0.05, celebrationSpinRemaining);
          lampGroup.rotation.y += spinStep;
          celebrationSpinRemaining -= spinStep;
        } else if (targetRotationY !== null) {
          // Smoothly interpolate lamp toward spotlight wick angle
          const diff = targetRotationY - lampGroup.rotation.y;
          lampGroup.rotation.y += diff * 0.055;

          if (Math.abs(diff) < 0.003) {
            lampGroup.rotation.y = targetRotationY;
            targetRotationY = null;
          }
        } else if (isAutoRotating) {
          if (autoRotateMode === 'sway') {
            // Ceremonial swaying arc keeping all 5 flames facing the audience
            const targetSway = Math.sin(elapsed * 0.45) * 0.18;
            lampGroup.rotation.y += (targetSway - lampGroup.rotation.y) * 0.04;
          } else {
            // Continuous 360 degree rotation
            lampGroup.rotation.y += BASE_ROTATION_SPEED;
          }
        }
      }

      // 2. 3D FLAME FLICKER & POINT LIGHT PULSATION
      wickFlames.forEach((flame, index) => {
        if (index < currentLitWicks) {
          // Organic flickering scale & tilt
          const flickerA = Math.sin(elapsed * 18 + index * 2.3) * 0.06;
          const flickerB = Math.cos(elapsed * 24 + index * 1.7) * 0.04;
          flame.scale.set(1.0 + flickerA, 1.0 + flickerB, 1.0 + flickerA);
          flame.rotation.z = Math.sin(elapsed * 12 + index) * 0.08;

          // Light intensity pulse
          const lightPulse = Math.sin(elapsed * 15 + index * 3) * 0.35;
          wickLights[index].intensity = 2.6 + lightPulse;
        } else {
          flame.scale.set(0.001, 0.001, 0.001);
          wickLights[index].intensity = 0;
        }
      });

      // 3. RISING 3D EMBER PARTICLES
      if (emberParticles && currentLitWicks > 0) {
        const positions = emberParticles.geometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          if (positions[i + 1] < -50 || positions[i + 1] > 6) {
            // Pick a random lit wick to emit from
            const litIdx = Math.floor(Math.random() * currentLitWicks);
            const anchor = wickAnchors[litIdx];
            if (anchor && lampGroup) {
              const worldPos = new THREE.Vector3();
              anchor.getWorldPosition(worldPos);
              positions[i] = worldPos.x + (Math.random() - 0.5) * 0.3;
              positions[i + 1] = worldPos.y + 0.6;
              positions[i + 2] = worldPos.z + (Math.random() - 0.5) * 0.3;
            }
          } else {
            positions[i + 1] += 0.04;
            positions[i] += Math.sin(elapsed * 3 + i) * 0.01;
          }
        }
        emberParticles.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // ========================================================================
    // 5. CEREMONIAL STATE MANAGEMENT & LIGHTING SYNCHRONIZATION
    // ========================================================================
    const ambientRoomGlow = document.getElementById('ambient-room-glow');
    const displayWickDots = document.getElementById('display-wick-dots');
    const displayWickCount = document.getElementById('display-wick-count');
    const bannerTitle = document.getElementById('banner-title');
    const bannerSub = document.getElementById('banner-sub');
    const celebrationMessage = document.getElementById('celebration-message');
    const uiHeader = document.getElementById('ui-header');
    const uiFooter = document.getElementById('ui-footer');
    const rotateToggleBtn = document.getElementById('rotate-toggle-btn');
    const rotateIndicator = document.getElementById('rotate-indicator');
    const audioToggleBtn = document.getElementById('audio-toggle-btn');
    const displayFullscreenBtn = document.getElementById('display-fullscreen-btn');

    let currentLitWicks = 0;

    function getDynamicGlow(count) {
      const ratio = Math.min(count / MAX_WICKS, 1.0);
      const opacity = (0.22 + ratio * 0.78).toFixed(2);
      const scale = (1.0 + ratio * 0.38).toFixed(2);
      const r = 255;
      const g = Math.floor(170 + ratio * 55);
      const b = Math.floor(40 + ratio * 50);
      const a1 = (0.05 + ratio * 0.65).toFixed(2);
      const a2 = (0.02 + ratio * 0.45).toFixed(2);
      return {
        bg: `radial-gradient(circle at 50% 45%, rgba(${r}, ${g}, ${b}, ${a1}) 0%, rgba(255, 120, 20, ${a2}) 50%, transparent 85%)`,
        opacity: opacity,
        scale: scale
      };
    }

    function updateLampDisplay(targetCount, triggeredByEvent = false) {
      const newCount = Math.min(Math.max(targetCount || 0, 0), MAX_WICKS);
      const isIncreasing = newCount > currentLitWicks;
      const previousCount = currentLitWicks;
      currentLitWicks = newCount;

      // Update Top Status Counter
      displayWickCount.textContent = `${currentLitWicks} / ${MAX_WICKS}`;

      // Update Top Dots (15 dots in 2 tiers)
      const dots = displayWickDots.querySelectorAll('div > span');
      dots.forEach((dot, idx) => {
        if (idx < currentLitWicks) {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-gold-400 shadow-[0_0_8px_#facc15] transition-all duration-500';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-white/20 transition-all duration-500';
        }
      });

      // Update Fallback CSS Flames if active
      if (isFallbackActive) {
        for (let i = 1; i <= MAX_WICKS; i++) {
          const flame = document.getElementById(`fb-flame-${i}`);
          if (flame) {
            if (i <= currentLitWicks) flame.classList.remove('hidden');
            else flame.classList.add('hidden');
          }
        }
      }

      // ROTATE WHEN LIGHTING ("this should rotate when lighting")
      if (isIncreasing && lampGroup && newCount > 0) {
        const newlyLitIndex = newCount - 1; // 0 to 14
        const wickAngle = getWickAngle(newlyLitIndex);

        if (newCount === MAX_WICKS) {
          // Grand Finale celebration: full 360-degree rotation!
          celebrationSpinRemaining = 2 * Math.PI;
        } else {
          // Rotate to showcase newly lit wick facing front (+Z)
          const targetAngle = -wickAngle;
          const currentRot = lampGroup.rotation.y;
          const delta = Math.atan2(Math.sin(targetAngle - currentRot), Math.cos(targetAngle - currentRot));
          targetRotationY = currentRot + delta;
        }
      }

      // Update Dynamic Ambient Room Glow
      const glowSetting = getDynamicGlow(currentLitWicks);
      ambientRoomGlow.style.background = glowSetting.bg;
      ambientRoomGlow.style.opacity = glowSetting.opacity;
      ambientRoomGlow.style.transform = `scale(${glowSetting.scale})`;

      // Audio & Message Updates
      if (isIncreasing) {
        playWickIgniteSound(currentLitWicks);
      }

      // Banner Text State for 15 wicks
      if (currentLitWicks === 0) {
        bannerTitle.textContent = "Awaiting First Wick";
        bannerTitle.className = "font-serif text-lg md:text-xl font-bold tracking-widest text-gold-300 uppercase";
        bannerSub.textContent = "Guests may now step forward to the tablet to illuminate the sacred flame.";
        celebrationMessage.classList.remove('border-emerald-400/50', 'shadow-[0_0_35px_rgba(234,179,8,0.4)]');
      } else if (currentLitWicks < LOWER_TIER_COUNT) {
        bannerTitle.textContent = `Wick #${currentLitWicks} Ignited (Lower Tier)`;
        bannerTitle.className = "font-serif text-lg md:text-xl font-bold tracking-widest text-amber-200 uppercase";
        bannerSub.textContent = `May the light dispel darkness and bring wisdom and prosperity • ${currentLitWicks} of ${MAX_WICKS} lit`;
        celebrationMessage.classList.remove('border-emerald-400/50', 'shadow-[0_0_35px_rgba(234,179,8,0.4)]');
      } else if (currentLitWicks === LOWER_TIER_COUNT) {
        bannerTitle.textContent = `Lower Tier Complete • 10 Wicks Lit`;
        bannerTitle.className = "font-serif text-lg md:text-xl font-bold tracking-widest text-gold-400 uppercase";
        bannerSub.textContent = `Ascending to the Crown Tier • Next guests step forward for the upper wicks ✨`;
        celebrationMessage.classList.remove('border-emerald-400/50', 'shadow-[0_0_35px_rgba(234,179,8,0.4)]');
      } else if (currentLitWicks < MAX_WICKS) {
        bannerTitle.textContent = `Crown Wick #${currentLitWicks} Ignited (Upper Tier)`;
        bannerTitle.className = "font-serif text-lg md:text-xl font-bold tracking-widest text-amber-100 uppercase";
        bannerSub.textContent = `The sacred Pahana rises in full splendor • ${currentLitWicks} of ${MAX_WICKS} lit`;
        celebrationMessage.classList.remove('border-emerald-400/50', 'shadow-[0_0_35px_rgba(234,179,8,0.4)]');
      } else {
        // ALL 15 WICKS LIT - GRAND FINALE!
        bannerTitle.textContent = "All 15 Wicks Shine in Full Radiance";
        bannerTitle.className = "font-serif text-xl md:text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-gold-400 to-amber-200 drop-shadow-[0_0_20px_rgba(250,204,21,0.9)]";
        bannerSub.textContent = "සියලු පහන් දැල්විණි • Wishing you a luminous, joyful, and prosperous celebration!";
        celebrationMessage.classList.add('border-emerald-400/50', 'shadow-[0_0_35px_rgba(234,179,8,0.4)]');

        if (isIncreasing) {
          playGrandFinaleSound();
        }
      }
    }

    // ========================================================================
    // 6. DATABASE SYNC (Firebase Realtime Database + Fallback)
    // ========================================================================
    if (lampStateRef) {
      lampStateRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val && typeof val.litWicks === 'number') {
          console.log("Firebase display received litWicks:", val.litWicks);
          updateLampDisplay(val.litWicks, true);
        } else {
          const stored = parseInt(localStorage.getItem('lampState_litWicks') || '0', 10);
          updateLampDisplay(stored, false);
        }
      }, (err) => {
        console.error("Firebase display sync error (Check Database Rules!):", err);
        const stored = parseInt(localStorage.getItem('lampState_litWicks') || '0', 10);
        updateLampDisplay(stored, false);
      });
    } else {
      const stored = parseInt(localStorage.getItem('lampState_litWicks') || '0', 10);
      updateLampDisplay(stored);
    }

    if (localSyncChannel) {
      localSyncChannel.onmessage = (event) => {
        if (event.data && typeof event.data.litWicks !== 'undefined') {
          updateLampDisplay(event.data.litWicks, true);
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'lampState_litWicks') {
        const newCount = parseInt(e.newValue || '0', 10);
        updateLampDisplay(newCount, true);
      }
    });

    // ========================================================================
    // 7. KEYBOARD SHORTCUTS & EVENT TECHNICIAN CONTROLS
    // ========================================================================
    window.setTestWicks = function(count) {
      initAudioContext();
      updateLampDisplay(count, true);
      localStorage.setItem('lampState_litWicks', count.toString());
      if (localSyncChannel) localSyncChannel.postMessage({ litWicks: count });
      if (lampStateRef) lampStateRef.set({ litWicks: count, lastTriggered: Date.now() });
    };

    window.stepTestWicks = function(delta) {
      const next = Math.min(Math.max(currentLitWicks + delta, 0), MAX_WICKS);
      window.setTestWicks(next);
    };

    window.addEventListener('keydown', (e) => {
      initAudioContext();

      if (e.code === 'Space' || e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        window.stepTestWicks(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        window.stepTestWicks(-1);
      } else if (e.key === 'r' || e.key === 'R') {
        window.setTestWicks(0);
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'h' || e.key === 'H' || e.key === 'i' || e.key === 'I') {
        uiHeader.classList.toggle('opacity-0');
        uiFooter.classList.toggle('opacity-0');
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    displayFullscreenBtn.addEventListener('click', toggleFullscreen);

    // Toggle Auto-Rotation button
    rotateToggleBtn.addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      if (isAutoRotating) {
        rotateIndicator.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        rotateToggleBtn.querySelector('span:last-child').textContent = 'Rotating';
      } else {
        rotateIndicator.className = 'w-2 h-2 rounded-full bg-slate-400';
        rotateToggleBtn.querySelector('span:last-child').textContent = 'Paused';
      }
    });

    audioToggleBtn.addEventListener('click', () => {
      initAudioContext();
    });

    window.addEventListener('click', () => {
      initAudioContext();
    }, { once: true });

    // START 3D ENGINE
    window.addEventListener('DOMContentLoaded', () => {
      init3D();
      animate();
    });
  </script>
</body>
</html>
